name: CI

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate policy JSON
        run: python -m json.tool policy.json

      - name: Test reconciler and platform helpers
        run: python -B -m unittest discover -s scripts -v

      - name: Test quota skill
        run: python -B -m unittest discover -s skills/ocx-quota/scripts -v

      - name: Check apply.sh syntax
        if: runner.os != 'Windows'
        run: bash -n apply.sh
